aid: tiger-global
name: Tiger Global Management
description: >-
  Tiger Global Management is an American investment firm founded in 2001 by Chase
  Coleman III, headquartered at 9 West 57th Street in New York City. It operates
  as a "crossover" platform that invests across both public and private markets,
  running a research-driven, long-term strategy to partner with high-quality,
  innovative technology companies across every stage of their lifecycle. Tiger
  Global concentrates on the global internet, software, consumer internet, and
  financial technology sectors, and its private/venture arm became one of the
  most prolific startup backers of the 2020-2022 boom, investing in 361 deals in
  2021 alone and backing hundreds of growth-stage companies worldwide. Check
  sizes range from early-stage venture through very large growth and pre-IPO
  rounds, and the same team follows companies from private markets into the
  public markets and beyond. The firm reported roughly $55.9B in assets under
  management as of May 2024, and its portfolio spans North America, Europe,
  Latin America, India, and China. Notable investments include Stripe, ByteDance,
  Databricks, Coinbase, Nubank, Snowflake, UiPath, GitLab, and Flipkart.
